# Пример для Ubuntu + nginx: скопируйте в /etc/nginx/sites-available/ и поправьте server_name и root.
# root должен указывать на каталог dist после сборки (npm run build на сервере).
#
#   sudo ln -s /etc/nginx/sites-available/igor-broker /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /var/www/igor-broker-site/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэш статики Vite (имена файлов с хэшем)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=86400";
    }

    # Telegram insights bot (PM2 on :8787)
    location /api/bot/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
