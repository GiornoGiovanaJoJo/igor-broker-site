# Деплой по SSH с паролем: sshpass → на сервере при необходимости clone → git pull + npm ci + build.
#
# Секреты (Settings → Secrets and variables → Actions):
#   SSH_HOST      — хост VPS
#   SSH_USER      — пользователь (например root)
#   SSH_PASSWORD  — пароль для SSH
#   SSH_PORT      — опционально; если нет — порт 22
#
# DEPLOY_TARGET_PATH — каталог клона на сервере (ниже). Если каталога нет — clone.
# На голой Ubuntu при первом запуске ставятся git и Node.js 22 (NodeSource), если их нет.

name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOY_TARGET_PATH: /var/www/igor-broker-site

    steps:
      - name: Known hosts + sshpass + deploy
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_TARGET_PATH: ${{ env.DEPLOY_TARGET_PATH }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?SSH_HOST}"
          : "${SSH_USER:?SSH_USER}"
          : "${SSH_PASSWORD:?SSH_PASSWORD}"
          PORT="${SSH_PORT:-22}"
          TARGET="${SSH_USER}@${SSH_HOST}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$SSH_PASSWORD"

          export DEPLOY_PATH="${DEPLOY_TARGET_PATH}"
          export REPO_URL="https://github.com/${{ github.repository }}.git"
          PARENT="$(dirname "$DEPLOY_PATH")"
          REMOTE_SCRIPT="$(printf '%s\n' \
            'set -euo pipefail' \
            'export DEBIAN_FRONTEND=noninteractive' \
            'if ! command -v git >/dev/null 2>&1; then' \
            '  apt-get update -qq' \
            '  apt-get install -y -qq git' \
            'fi' \
            'if ! command -v node >/dev/null 2>&1 || ! command -v npm >/dev/null 2>&1; then' \
            '  apt-get update -qq' \
            '  apt-get install -y -qq ca-certificates curl gnupg' \
            '  curl -fsSL https://deb.nodesource.com/setup_22.x | bash -' \
            '  apt-get install -y -qq nodejs' \
            'fi' \
            "mkdir -p $(printf '%q' "$PARENT")" \
            "if [ ! -d $(printf '%q' "$DEPLOY_PATH")/.git ]; then git clone $(printf '%q' "$REPO_URL") $(printf '%q' "$DEPLOY_PATH"); fi" \
            "cd $(printf '%q' "$DEPLOY_PATH")" \
            'bash scripts/server-deploy.sh')"

          sshpass -e ssh \
            -p "$PORT" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=60 \
            -o ServerAliveInterval=30 \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no \
            -tt \
            "$TARGET" \
            bash -s <<<"$REMOTE_SCRIPT"
