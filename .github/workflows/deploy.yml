# Деплой по SSH с паролем: sshpass → на сервере при необходимости clone → git pull + npm ci + build.
#
# Секреты (Settings → Secrets and variables → Actions):
#   SSH_HOST      — хост VPS
#   SSH_USER      — пользователь (например root)
#   SSH_PASSWORD  — пароль для SSH
#   SSH_PORT      — опционально; если нет — порт 22
#
#   TELEGRAM_BOT_TOKEN, BOT_EDITOR_PIN, SANITY_WRITE_TOKEN, TELEGRAM_PROXY_URL, CURSOR_API_KEY
#   (GitHub Secrets → передаются на сервер при деплое)
# DEPLOY_TARGET_PATH — каталог клона на сервере (ниже). Если каталога нет — clone.
# На голой Ubuntu при первом запуске ставятся git и Node.js 22 (NodeSource), если их нет.
# Если apt ругается на nginx.org (нет ключа) — такие .list отключаются и update повторяется.

name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOY_TARGET_PATH: /var/www/igor-broker-site

    steps:
      - name: Known hosts + sshpass + deploy
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_TARGET_PATH: ${{ env.DEPLOY_TARGET_PATH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_EDITOR_PIN: ${{ secrets.BOT_EDITOR_PIN }}
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
          TELEGRAM_PROXY_URL: ${{ secrets.TELEGRAM_PROXY_URL }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          BOT_PUBLIC_URL: https://igor-broker.site/api/bot
          VITE_SITE_URL: https://igor-broker.site
          VITE_YANDEX_METRIKA_ID: "109498772"
          VITE_CLARITY_ID: ${{ secrets.CLARITY_ID }}
          SITE_DOMAIN: igor-broker.site
        run: |
          set -euo pipefail
          : "${SSH_HOST:?SSH_HOST}"
          : "${SSH_USER:?SSH_USER}"
          : "${SSH_PASSWORD:?SSH_PASSWORD}"
          PORT="${SSH_PORT:-22}"
          TARGET="${SSH_USER}@${SSH_HOST}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$SSH_PASSWORD"

          export DEPLOY_PATH="${DEPLOY_TARGET_PATH}"
          export REPO_URL="https://github.com/${{ github.repository }}.git"
          PARENT="$(dirname "$DEPLOY_PATH")"
          REMOTE_SCRIPT="$(printf '%s\n' \
            'set -euo pipefail' \
            'export DEBIAN_FRONTEND=noninteractive' \
            'export DEBCONF_NONINTERACTIVE_SEEN=true' \
            'export NEEDRESTART_MODE=a' \
            'export CI=true' \
            'shopt -s nullglob' \
            'if ! apt-get update -qq; then' \
            '  for f in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do' \
            '    [ -f "$f" ] || continue' \
            '    grep -q nginx.org "$f" 2>/dev/null && mv "$f" "$f.disabled-deploy" || true' \
            '  done' \
            '  sed -i.bak-deploy "/nginx.org/s/^/# /" /etc/apt/sources.list 2>/dev/null || true' \
            '  apt-get update -qq' \
            'fi' \
            'if ! command -v git >/dev/null 2>&1; then' \
            '  apt-get install -y -qq git' \
            'fi' \
            'if ! command -v node >/dev/null 2>&1 || ! command -v npm >/dev/null 2>&1; then' \
            '  apt-get install -y -qq ca-certificates curl gnupg' \
            '  curl -fsSL https://deb.nodesource.com/setup_22.x | bash -' \
            '  apt-get install -y -qq nodejs' \
            'fi' \
            "mkdir -p $(printf '%q' "$PARENT")" \
            "if [ ! -d $(printf '%q' "$DEPLOY_PATH")/.git ]; then git clone $(printf '%q' "$REPO_URL") $(printf '%q' "$DEPLOY_PATH"); fi" \
            "cd $(printf '%q' "$DEPLOY_PATH")" \
            "TELEGRAM_BOT_TOKEN=$(printf '%q' "${TELEGRAM_BOT_TOKEN:-}") BOT_EDITOR_PIN=$(printf '%q' "${BOT_EDITOR_PIN:-842019}") SANITY_WRITE_TOKEN=$(printf '%q' "${SANITY_WRITE_TOKEN:-}") TELEGRAM_PROXY_URL=$(printf '%q' "${TELEGRAM_PROXY_URL:-}") CURSOR_API_KEY=$(printf '%q' "${CURSOR_API_KEY:-}") TELEGRAM_USE_POLLING=1 VITE_SITE_URL=$(printf '%q' "${VITE_SITE_URL:-}") VITE_YANDEX_METRIKA_ID=$(printf '%q' "${VITE_YANDEX_METRIKA_ID:-}") VITE_CLARITY_ID=$(printf '%q' "${VITE_CLARITY_ID:-}") SITE_DOMAIN=$(printf '%q' "${SITE_DOMAIN:-}") bash scripts/server-deploy.sh")"

          # Без -T/-tt: при выделении TTY bash -s часто не читает скрипт со stdin и «висит» минутами.
          sshpass -e ssh -T \
            -p "$PORT" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=60 \
            -o ServerAliveInterval=30 \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no \
            "$TARGET" \
            bash -s <<<"$REMOTE_SCRIPT"
